name: Daily Unstop run

on:
  schedule:
    - cron: "30 1 * * *"      # 07:00 IST, before Isha's morning review
  workflow_dispatch: {}       # "Run workflow" button for manual runs

concurrency:
  group: pipeline            # never two runs writing state at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Kolkata
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python cli.py cloud --day "$(date +%F)"
